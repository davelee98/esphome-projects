# esk1 air epaper: SEN65 air quality on a 4.2" OpenDisplay e-paper ESL, from an
# ESPHome Starter Kit (ESP32-C6).
#   C6 module -> controller, ESP-IDF
#   SEN65     -> I2C on GPIO1 (SDA) / GPIO0 (SCL)
#   ESL       -> 4.2" OpenDisplay e-paper label over BLE (no wiring)
#
# The ESK-1 draws the page itself and pushes it to the label over BLE with the
# local opendisplay component (components/opendisplay). It connects only for
# an upload, then disconnects so the label can sleep. Unchanged frames are not
# re-sent.
#
# No bluetooth_proxy here: Home Assistant's OpenDisplay integration could then
# reach the same label through this device and the two would fight over it.
substitutions:
  # How the label is found. By default by its advertised BLE name (a trailing
  # * matches a prefix); the name can also be changed at run time from the
  # web page or Home Assistant ("BLE Name"), which then wins over this value.
  esl_name: "OpenDisplay*"
  # MAC override: any address other than 00:00:00:00:00:00 is used as is and
  # the name is ignored. The address in use is shown as "Label MAC".
  esl_mac: "00:00:00:00:00:00"

esphome:
  name: esk1-air-epaper
  friendly_name: esk1 air epaper
  min_version: 2026.3.0          # sen6x

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: components
    components: [opendisplay]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esk1-air-epaper Fallback Hotspot
    password: !secret esk1_air_epaper_ap_password

api:
  encryption:
    key: !secret esk1_air_epaper_api_key

ota:
  - platform: esphome

captive_portal:

# Web page at http://esk1-air-epaper.local/ with the label's BLE name (editable)
# and MAC address, next to the sensor readings.
web_server:
  port: 80
  version: 3

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - id: esl_client
    mac_address: ${esl_mac}

i2c:
  - id: i2c_bus
    sda: GPIO1
    scl: GPIO0

# sen6x ignores readings for 60 s after start-up, so the first values take
# up to about 2 minutes.
sensor:
  - platform: sen6x
    id: sen65
    type: SEN65
    update_interval: 60s
    pm_1_0:
      name: PM1.0
      id: pm_1_0
    pm_2_5:
      name: PM2.5
      id: pm_2_5
    pm_4_0:
      name: PM4.0
      id: pm_4_0
    pm_10_0:
      name: PM10
      id: pm_10_0
    temperature:
      name: Temperature
      id: temperature
    humidity:
      name: Humidity
      id: humidity
    voc_index:
      name: VOC Index
      id: voc_index
    nox_index:
      name: NOx Index
      id: nox_index

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

font:
  # Three Terminus assets: normal labels and bold values. Value fonts contain digits,
  # decimal point, minus, space, degree sign, F, C and percent.
  - file: "fonts/terminus/ter-u14n.bdf"
    id: font_label
    size: 14
    bpp: 1
    glyphsets: []
    glyphs: ["ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,:;!?+-_/%()°µ³"]
  - file: "fonts/terminus/ter-u32b.bdf"
    id: font_value
    size: 32
    bpp: 1
    glyphsets: []
    glyphs: ["0123456789.- °FC%"]
  - file: "fonts/terminus/ter-u24b.bdf"
    id: font_medium
    size: 24
    bpp: 1
    glyphsets: []
    glyphs: ["0123456789.- °FC%"]

# A 30,000-byte frame buffer (400x300 BWRY, the largest supported) is reserved
# at boot. The label's panel size and colour scheme are read on every
# connection and win over width / height / color_scheme here, which are
# optional: they are only the starting point, and the fallback for a label
# with no stored config.
display:
  - platform: opendisplay
    id: epaper
    ble_client_id: esl_client
    ble_name: ${esl_name}
    width: 400
    height: 300
    color_scheme: BWRY           # MONO, BWR, BWY or BWRY
    refresh_mode: FULL           # FULL or FAST
    update_interval: 5min
    # COLOR_ON is black ink, COLOR_OFF is paper (the page is cleared to
    # white). Other colours become the nearest ink, e.g. Color(255, 0, 0) red.
    lambda: |-
      auto value = [&](float v, const char *fmt, char *buf, size_t n) {
        if (std::isnan(v)) snprintf(buf, n, "--");
        else snprintf(buf, n, fmt, v);
        return buf;
      };
      char buf[16];

      it.print(200, 6, id(font_label), TextAlign::TOP_CENTER, "Air Quality");
      it.line(10, 36, 390, 36);

      // Left column: particulates (ug/m3, rounded so small jitter does not
      // trigger a new upload).
      it.print(20, 50, id(font_label), "PM2.5");
      it.print(20, 74, id(font_value), value(id(pm_2_5).state, "%.0f", buf, sizeof(buf)));
      it.print(20, 130, id(font_label), "PM10");
      it.print(20, 154, id(font_value), value(id(pm_10_0).state, "%.0f", buf, sizeof(buf)));
      it.print(20, 210, id(font_label), "PM1.0");
      it.print(90, 210, id(font_label), value(id(pm_1_0).state, "%.0f", buf, sizeof(buf)));
      it.print(20, 232, id(font_label), "PM4.0");
      it.print(90, 232, id(font_label), value(id(pm_4_0).state, "%.0f", buf, sizeof(buf)));
      it.print(20, 254, id(font_label), "ug/m3");

      it.line(200, 46, 200, 270);

      // Right column: gas indices and climate.
      it.print(220, 50, id(font_label), "VOC");
      it.print(220, 74, id(font_value), value(id(voc_index).state, "%.0f", buf, sizeof(buf)));
      it.print(220, 130, id(font_label), "NOx");
      it.print(220, 154, id(font_value), value(id(nox_index).state, "%.0f", buf, sizeof(buf)));
      it.print(220, 210, id(font_label), "Temp");
      it.print(390, 210, id(font_medium), TextAlign::TOP_RIGHT, value(id(temperature).state, "%.1f °C", buf, sizeof(buf)));
      it.print(220, 244, id(font_label), "Humidity");
      it.print(390, 244, id(font_medium), TextAlign::TOP_RIGHT, value(id(humidity).state, "%.0f %%", buf, sizeof(buf)));

button:
  - platform: template
    name: Refresh E-Paper
    on_press:
      - component.update: epaper

# The label's BLE name, editable on the web page and in Home Assistant. The
# value is kept across reboots; esl_name above is only the first-boot default.
text:
  - platform: template
    id: ble_name_text
    name: BLE Name
    icon: mdi:bluetooth
    entity_category: config
    mode: text
    max_length: 29
    optimistic: true
    restore_value: true
    initial_value: ${esl_name}
    on_value:
      - lambda: id(epaper).set_ble_name(x);

text_sensor:
  - platform: template
    name: Label MAC
    icon: mdi:bluetooth-connect
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      std::string mac = id(epaper).get_label_mac();
      if (mac.empty())
        return std::string("not found yet");
      if (id(epaper).has_mac_override())
        mac += " (override)";
      return mac;
