# esk1 air epaper, built from this repo:
#
#   uvx esphome@2026.11.0 run esk1-air-epaper.yaml
#
# The device itself is in esk1-air-epaper.base.yaml. This file adds the
# components from ./components, so local edits to them are built at once,
# and this unit's API key and fallback hotspot password. Secrets come from
# secrets.yaml next to this file (gitignored): wifi_ssid, wifi_password,
# esk1_air_epaper_ap_password and esk1_air_epaper_api_key.
#
# To build in ESPHome Device Builder instead, see examples/device-builder.yaml.

packages:
  device: !include esk1-air-epaper.base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [opendisplay, aqi_dashboard, timezone_select]

api:
  encryption:
    key: !secret esk1_air_epaper_api_key

wifi:
  ap:
    password: !secret esk1_air_epaper_ap_password
